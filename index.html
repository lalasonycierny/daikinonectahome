<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daikin teploty</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:960px;margin:0 auto;padding:16px}
  .cards{display:flex;gap:12px;flex-wrap:wrap}
  .card{border:1px solid #8884;border-radius:8px;padding:12px 16px;min-width:200px}
  .big{font-size:2rem;font-weight:600}
  button{padding:6px 14px;margin-right:6px;cursor:pointer}
  button.on{font-weight:700;outline:2px solid #4a90d9}
  table{border-collapse:collapse;margin-top:16px;width:100%}
  td,th{border-bottom:1px solid #8884;padding:6px;text-align:left}
</style>
</head>
<body>
<h1>Klimatizácie Daikin</h1>
<p id="msg">Načítavam dáta…</p>
<div id="cards" class="cards"></div>
<p>
  <button data-r="day" class="on">Deň</button>
  <button data-r="week">Týždeň</button>
  <button data-r="year">Rok</button>
</p>
<canvas id="chart" height="110"></canvas>
<table id="stats"></table>

<script>
var DATA_URL = "https://raw.githubusercontent.com/lalasonycierny/daikinonectahome/data/history.csv";
var rows = [], chart = null, range = "day";
var msg = document.getElementById("msg");

function parse(txt){
  return txt.trim().split(/\r?\n/).slice(1).map(function(l){
    var c = l.split(",");
    return {t:new Date(c[0]), name:c[2],
      room:c[3]===""?null:+c[3], out:c[4]===""?null:+c[4],
      set:c[5]===""?null:+c[5], mode:c[6], power:c[7]};
  });
}

function bucketKey(d, r){
  var x = new Date(d);
  if (r === "week") x.setMinutes(0,0,0);
  if (r === "year") x.setHours(0,0,0,0);
  return +x;
}

function avg(a){ return a.reduce(function(s,v){return s+v;},0)/a.length; }

function group(list, getVal){
  var m = new Map();
  list.forEach(function(r){
    var k = range==="day" ? +r.t : bucketKey(r.t, range);
    if(!m.has(k)) m.set(k,[]);
    m.get(k).push(getVal(r));
  });
  return Array.from(m).map(function(e){ return {x:e[0], y:avg(e[1])}; });
}

function render(){
  var now = new Date();
  var span = {day:1, week:7, year:365}[range] * 86400000;
  var sel = rows.filter(function(r){ return now - r.t <= span && r.room !== null; });
  var names = Array.from(new Set(rows.map(function(r){return r.name;})));
  var datasets = [], stats = [];

  names.forEach(function(n){
    var rs = sel.filter(function(r){return r.name===n;});
    if (!rs.length) return;
    datasets.push({label:n, data:group(rs, function(r){return r.room;}), tension:.25, pointRadius:3});
    var v = rs.map(function(r){return r.room;});
    stats.push([n, Math.min.apply(null,v), Math.max.apply(null,v), avg(v)]);
  });

  var outs = sel.filter(function(r){return r.out !== null;});
  if (outs.length){
    datasets.push({label:"Vonku", borderDash:[5,4], pointRadius:3,
      data:group(outs, function(r){return r.out;})});
  }

  document.getElementById("stats").innerHTML =
    "<tr><th>Zariadenie</th><th>Min</th><th>Max</th><th>Priemer</th></tr>" +
    stats.map(function(s){
      return "<tr><td>"+s[0]+"</td><td>"+s[1].toFixed(1)+"</td><td>"+s[2].toFixed(1)+"</td><td>"+s[3].toFixed(1)+"</td></tr>";
    }).join("");

  if (typeof Chart === "undefined"){ msg.textContent = "Chart.js sa nenacital (graf nie je dostupny)."; return; }
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type:"line", data:{datasets:datasets},
    options:{parsing:false, scales:{
      x:{type:"linear", ticks:{callback:function(v){
        var d = new Date(v);
        return range==="year" ? d.toLocaleDateString("sk-SK")
          : d.toLocaleString("sk-SK",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
      }}},
      y:{title:{display:true,text:"°C"}}}}
  });
}

function cards(){
  var last = new Map();
  rows.forEach(function(r){ last.set(r.name, r); });
  document.getElementById("cards").innerHTML = Array.from(last.values()).map(function(r){
    return '<div class="card"><div>'+r.name+'</div>'+
      '<div class="big">'+(r.room===null?"–":r.room)+' °C</div>'+
      '<div>Vonku: '+(r.out===null?"–":r.out)+' °C</div>'+
      '<div>Nastavené: '+(r.set===null?"–":r.set)+' °C · '+(r.mode||"")+' · '+(r.power||"")+'</div>'+
      '<small>'+r.t.toLocaleString("sk-SK")+'</small></div>';
  }).join("");
}

document.querySelectorAll("button").forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on"); range = b.dataset.r;
    try { render(); } catch(e){ msg.textContent = "Chyba: " + e; }
  };
});

fetch(DATA_URL + "?_=" + Date.now())
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(function(t){
    rows = parse(t);
    msg.textContent = "Načítaných záznamov: " + rows.length;
    cards();
    render();
  })
  .catch(function(e){ msg.textContent = "Chyba: " + e; });
</script>
</body>
</html>
