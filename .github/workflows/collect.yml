name: collect
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare data branch
        run: |
          git config user.name "daikin-bot"
          git config user.email "bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data
            git worktree add -B data datadir origin/data
          else
            git worktree add --detach datadir
            cd datadir
            git checkout --orphan data
            git rm -rf . -q
          fi

      - run: pip install requests

      - name: Collect
        env:
          DAIKIN_CLIENT_ID: ${{ secrets.DAIKIN_CLIENT_ID }}
          DAIKIN_CLIENT_SECRET: ${{ secrets.DAIKIN_CLIENT_SECRET }}
          DAIKIN_REFRESH_TOKEN: ${{ secrets.DAIKIN_REFRESH_TOKEN }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python collect.py

      - name: Rotate refresh token
        if: hashFiles('new_refresh_token.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set DAIKIN_REFRESH_TOKEN --body "$(cat new_refresh_token.txt)" --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::Daikin vydal novy refresh token, ale GH_PAT nie je nastaveny"
          fi

      - name: Commit data
        run: |
          cd datadir
          git add history.csv
          git commit -m "data $(date -u +%FT%TZ)" || exit 0
          git push origin HEAD:data
